<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: #0f0f0f;
    font-family: Georgia, serif;
    padding: 0 1.5rem;
  }
  .wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .ornament {
    font-size: 16px;
    color: #444;
    flex-shrink: 0;
  }
  .text-area { flex: 1; min-width: 0; }
  .quote {
    font-size: 13px;
    line-height: 1.5;
    color: #ccc;
    font-style: italic;
    transition: opacity 0.3s ease;
  }
  .author {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    color: #555;
    margin-top: 4px;
    transition: opacity 0.3s ease;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  button {
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: #555;
    white-space: nowrap;
  }
  button:hover { color: #999; border-color: #444; }
  .btn-copy.success { color: #4a9a5a; border-color: #2a6b3a; }
  .fade { opacity: 0; }
</style>
</head>
<body>
<div class="wrap">
  <span class="ornament">✦</span>
  <div class="text-area">
    <p class="quote" id="quote">...</p>
    <p class="author" id="author"></p>
  </div>
  <div class="actions">
    <button class="btn-copy" id="copyBtn" onclick="copyQuote()">Copy</button>
    <button onclick="newQuote()">New</button>
  </div>
</div>
<script>
// Last-resort quotes, used only if quotes.json cannot be loaded.
const FALLBACK = [
  ["The secret of getting ahead is getting started.", "Mark Twain"],
  ["It always seems impossible until it's done.", "Nelson Mandela"],
  ["Do what you can, with what you have, where you are.", "Theodore Roosevelt"],
  ["The best time to plant a tree was 20 years ago. The second best time is now.", "Chinese Proverb"],
  ["An unexamined life is not worth living.", "Socrates"],
].map(([q, a]) => ({ q, a }));

let quotes = null;          // loaded once, then reused
let currentIdx = -1;
let current = { text: '', author: '' };

async function getQuotes() {
  if (quotes) return quotes;
  try {
    // no-cache: revalidate with the server so new quotes show up quickly
    const res = await fetch('quotes.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const list = await res.json();
    if (!Array.isArray(list) || list.length === 0) throw new Error('empty');
    quotes = list;
  } catch {
    quotes = FALLBACK;
  }
  return quotes;
}

// Same date -> same index, so the "daily" quote is stable across reloads.
// FNV-1a hash of the local date string, mod list length.
function dayIndex(n) {
  const d = new Date();
  const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  let h = 2166136261;
  for (const c of key) {
    h ^= c.charCodeAt(0);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) % n;
}

function randomIndex(n) {
  let i;
  do { i = Math.floor(Math.random() * n); } while (n > 1 && i === currentIdx);
  return i;
}

async function showQuote(daily) {
  const q = document.getElementById('quote');
  const a = document.getElementById('author');
  q.classList.add('fade'); a.classList.add('fade');
  await new Promise(r => setTimeout(r, 250));
  const list = await getQuotes();
  currentIdx = daily ? dayIndex(list.length) : randomIndex(list.length);
  const p = list[currentIdx];
  current = { text: '“' + p.q + '”', author: p.a };
  q.textContent = current.text;
  a.textContent = '— ' + current.author;
  q.classList.remove('fade'); a.classList.remove('fade');
}

function newQuote() { showQuote(false); }

function copyQuote() {
  const btn = document.getElementById('copyBtn');
  navigator.clipboard.writeText(current.text + ' — ' + current.author)
    .then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('success');
    })
    .catch(() => { btn.textContent = 'Copy failed'; })
    .finally(() => setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('success');
    }, 2000));
}

showQuote(true);
</script>
</body>
</html>
