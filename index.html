<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    font-family: Georgia, 'Times New Roman', serif;
    padding: 2rem;
  }

  .card {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }

  .date {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 3rem;
  }

  .ornament {
    font-size: 28px;
    color: #333;
    margin-bottom: 2rem;
    display: block;
  }

  .quote {
    font-size: 26px;
    line-height: 1.6;
    color: #e8e8e8;
    font-style: italic;
    font-weight: 400;
    margin-bottom: 2rem;
    min-height: 80px;
    transition: opacity 0.4s ease;
  }

  .author {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 3rem;
    transition: opacity 0.4s ease;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }

  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
  }

  .btn-copy {
    background: #e8e8e8;
    color: #0f0f0f;
  }

  .btn-copy:hover { background: #fff; }

  .btn-copy.success {
    background: #2a6b3a;
    color: #fff;
  }

  .btn-new {
    background: transparent;
    color: #555;
    border: 1px solid #2a2a2a;
  }

  .btn-new:hover { color: #999; border-color: #444; }

  .btn-new:active { transform: scale(0.97); }

  .fade { opacity: 0; }

  .tag {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    color: #333;
    letter-spacing: 0.05em;
    margin-top: 3rem;
  }
</style>
</head>
<body>
<div class="card">
  <p class="date" id="date"></p>
  <span class="ornament">✦</span>
  <p class="quote" id="quote">...</p>
  <p class="author" id="author"></p>
  <div class="actions">
    <button class="btn-copy" id="copyBtn" onclick="copyQuote()">Copy</button>
    <button class="btn-new" onclick="newQuote()">New quote</button>
  </div>
  <p class="tag">Daily Quote</p>
</div>

<script>
const fallback = [
  ["The secret of getting ahead is getting started.", "Mark Twain"],
  ["It always seems impossible until it's done.", "Nelson Mandela"],
  ["In the middle of every difficulty lies opportunity.", "Albert Einstein"],
  ["Do what you can, with what you have, where you are.", "Theodore Roosevelt"],
  ["The only way to do great work is to love what you do.", "Steve Jobs"],
  ["Life is what happens when you're busy making other plans.", "John Lennon"],
  ["The future belongs to those who believe in the beauty of their dreams.", "Eleanor Roosevelt"],
  ["It is during our darkest moments that we must focus to see the light.", "Aristotle"],
  ["Spread love everywhere you go. Let no one ever come to you without leaving happier.", "Mother Teresa"],
  ["When you reach the end of your rope, tie a knot in it and hang on.", "Franklin D. Roosevelt"],
  ["Always remember that you are absolutely unique. Just like everyone else.", "Margaret Mead"],
  ["Don't judge each day by the harvest you reap but by the seeds that you plant.", "Robert Louis Stevenson"],
  ["The best time to plant a tree was 20 years ago. The second best time is now.", "Chinese Proverb"],
  ["An unexamined life is not worth living.", "Socrates"],
  ["Spread your wings and let the fairy in you fly.", "Anonymous"],
  ["Everything you've ever wanted is on the other side of fear.", "George Addair"],
  ["Dream big and dare to fail.", "Norman Vaughan"],
  ["You must be the change you wish to see in the world.", "Mahatma Gandhi"],
  ["The mind is everything. What you think you become.", "Buddha"],
  ["Whatever the mind of man can conceive and believe, it can achieve.", "Napoleon Hill"],
  ["Strive not to be a success, but rather to be of value.", "Albert Einstein"],
  ["Two roads diverged in a wood, and I took the one less traveled by.", "Robert Frost"],
  ["I attribute my success to this: I never gave or took any excuse.", "Florence Nightingale"],
  ["You miss 100% of the shots you don't take.", "Wayne Gretzky"],
  ["I've missed more than 9000 shots in my career. I've lost almost 300 games.", "Michael Jordan"],
  ["The most common way people give up their power is by thinking they don't have any.", "Alice Walker"],
  ["The most difficult thing is the decision to act; the rest is merely tenacity.", "Amelia Earhart"],
  ["Life is 10% what happens to me and 90% of how I react to it.", "Charles Swindoll"],
  ["The only person you are destined to become is the person you decide to be.", "Ralph Waldo Emerson"],
  ["Go confidently in the direction of your dreams.", "Henry David Thoreau"],
];

let current = { text: '', author: '' };

function setDate() {
  const now = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date').textContent = now.toLocaleDateString('en-GB', opts);
}

async function loadQuote() {
  const q = document.getElementById('quote');
  const a = document.getElementById('author');
  q.classList.add('fade');
  a.classList.add('fade');

  await new Promise(r => setTimeout(r, 300));

  try {
    const res = await fetch('https://api.quotable.io/random?maxLength=140&minLength=40');
    if (!res.ok) throw new Error();
    const data = await res.json();
    current = { text: '\u201c' + data.content + '\u201d', author: data.author };
  } catch {
    const pick = fallback[Math.floor(Math.random() * fallback.length)];
    current = { text: '\u201c' + pick[0] + '\u201d', author: pick[1] };
  }

  q.textContent = current.text;
  a.textContent = '\u2014\u2002' + current.author;
  q.classList.remove('fade');
  a.classList.remove('fade');
}

function newQuote() { loadQuote(); }

function copyQuote() {
  const text = current.text + '  \u2014 ' + current.author;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('success');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('success');
    }, 2000);
  });
}

setDate();
loadQuote();
</script>
</body>
</html>
