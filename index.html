<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: #0f0f0f;
    font-family: Georgia, serif;
    padding: 0 1.5rem;
  }
  .wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .ornament {
    font-size: 16px;
    color: #444;
    flex-shrink: 0;
  }
  .text-area { flex: 1; min-width: 0; }
  .quote {
    font-size: 13px;
    line-height: 1.5;
    color: #ccc;
    font-style: italic;
    transition: opacity 0.3s ease;
  }
  .author {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    color: #555;
    margin-top: 4px;
    transition: opacity 0.3s ease;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  button {
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: #555;
    white-space: nowrap;
  }
  button:hover { color: #999; border-color: #444; }
  .btn-copy.success { color: #4a9a5a; border-color: #2a6b3a; }
  .fade { opacity: 0; }
</style>
</head>
<body>
<div class="wrap">
  <span class="ornament">✦</span>
  <div class="text-area">
    <p class="quote" id="quote">...</p>
    <p class="author" id="author"></p>
  </div>
  <div class="actions">
    <button class="btn-copy" id="copyBtn" onclick="copyQuote()">Copy</button>
    <button onclick="newQuote()">New</button>
  </div>
</div>
<script>
const fallback = [
  ["The secret of getting ahead is getting started.", "Mark Twain"],
  ["It always seems impossible until it's done.", "Nelson Mandela"],
  ["In the middle of every difficulty lies opportunity.", "Albert Einstein"],
  ["Do what you can, with what you have, where you are.", "Theodore Roosevelt"],
  ["The only way to do great work is to love what you do.", "Steve Jobs"],
  ["Life is what happens when you're busy making other plans.", "John Lennon"],
  ["The future belongs to those who believe in the beauty of their dreams.", "Eleanor Roosevelt"],
  ["Spread love everywhere you go.", "Mother Teresa"],
  ["The best time to plant a tree was 20 years ago. The second best time is now.", "Chinese Proverb"],
  ["You must be the change you wish to see in the world.", "Mahatma Gandhi"],
  ["The mind is everything. What you think you become.", "Buddha"],
  ["Strive not to be a success, but rather to be of value.", "Albert Einstein"],
  ["You miss 100% of the shots you don't take.", "Wayne Gretzky"],
  ["The most difficult thing is the decision to act; the rest is merely tenacity.", "Amelia Earhart"],
  ["Go confidently in the direction of your dreams.", "Henry David Thoreau"],
  ["Everything you've ever wanted is on the other side of fear.", "George Addair"],
  ["Dream big and dare to fail.", "Norman Vaughan"],
  ["An unexamined life is not worth living.", "Socrates"],
  ["Life is 10% what happens to me and 90% how I react to it.", "Charles Swindoll"],
  ["The only person you are destined to become is the person you decide to be.", "Ralph Waldo Emerson"],
];
let current = { text: '', author: '' };
async function loadQuote() {
  const q = document.getElementById('quote');
  const a = document.getElementById('author');
  q.classList.add('fade'); a.classList.add('fade');
  await new Promise(r => setTimeout(r, 250));
  try {
    const res = await fetch('https://api.quotable.io/random?maxLength=120&minLength=30');
    if (!res.ok) throw new Error();
    const d = await res.json();
    current = { text: '\u201c' + d.content + '\u201d', author: d.author };
  } catch {
    const p = fallback[Math.floor(Math.random() * fallback.length)];
    current = { text: '\u201c' + p[0] + '\u201d', author: p[1] };
  }
  q.textContent = current.text;
  a.textContent = '\u2014 ' + current.author;
  q.classList.remove('fade'); a.classList.remove('fade');
}
function newQuote() { loadQuote(); }
function copyQuote() {
  navigator.clipboard.writeText(current.text + ' \u2014 ' + current.author);
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'Copied!';
  btn.classList.add('success');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('success'); }, 2000);
}
loadQuote();
</script>
</body>
</html>
