name: Sync quotes from Notion

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the :00 mark to avoid peak load
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to push quotes.json back

concurrency:
  group: sync-quotes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch active quotes from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: 92b8df0f018740aebb1b7d78e8e6e0c0
        run: python3 scripts/sync_quotes.py

      - name: Commit quotes.json if it changed
        run: |
          # `git status --porcelain` also catches a brand-new untracked file,
          # which `git diff --quiet` would miss.
          if [ -z "$(git status --porcelain quotes.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "chore: sync quotes from Notion"
          git push
